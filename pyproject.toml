[project]
name = "log-analyzer"
version = "0.1.0"
description = "connection logs analyzer in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.3",
]

[project.scripts]
log-analyzer = "log_analyzer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "pydantic>=2.10",
]